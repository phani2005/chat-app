<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075E54">

    <title>Calls</title>

    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="/manifest.json">

    <style>
        /* 3-dot menu button */
        .menu-wrapper {
            position: relative;
        }

        .menu-dots {
            font-size: 22px;
            cursor: pointer;
            color: white;
            padding: 5px 10px;
            user-select: none;
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 30px;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            border-radius: 10px;
            min-width: 180px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 10;
        }

        .dropdown-menu div {
            padding: 12px 15px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #222;
        }

        .dropdown-menu div:hover {
            background: #f0f0f0;
            color: black;
        }

        /* Select bar */
        .select-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .select-bar .danger-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .select-bar .danger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .select-bar .cancel-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .select-bar .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .call-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #00c6ff;
            margin-right: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="top-bar" id="top-bar">

            <i class="fa-solid fa-arrow-left back-btn" onclick="goBack()"></i>

            <h3>Calls</h3>

            <div class="menu-wrapper">
                <i class="fa-solid fa-ellipsis-vertical menu-dots" id="menuBtn"></i>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div id="selectOption">Select</div>
                </div>
            </div>

        </div>

        <div id="selectBar" style="display:none;" class="select-bar">
            <button id="deleteBtn" class="danger-btn">Delete</button>
            <button id="deleteAllBtn" class="danger-btn">Delete All</button>
            <button id="cancelBtn" class="cancel-btn">Cancel</button>
        </div>

        <div id="callList"></div>

    </div>

    <script>

        const user = localStorage.getItem("loggedUser")
        let selectMode = false
        let selectedCalls = new Set()
        let allCallData = []

        // ================= MENU =================

        const menuBtn = document.getElementById("menuBtn")
        const dropdownMenu = document.getElementById("dropdownMenu")

        menuBtn.addEventListener("click", () => {
            dropdownMenu.style.display =
                dropdownMenu.style.display === "flex"
                    ? "none"
                    : "flex"
        })

        document.addEventListener("click", (e) => {
            const isClickInsideMenu = dropdownMenu.contains(e.target)
            const isClickOnButton = menuBtn.contains(e.target)

            if (!isClickInsideMenu && !isClickOnButton) {
                dropdownMenu.style.display = "none"
            }
        })

        // ================= NAVIGATION =================

        function goBack() {
            window.location.href = "/main.html"
        }

        // ================= LOAD CALLS =================

        async function loadCalls() {

            const res = await fetch(`/calls/${user}`)

            const calls = await res.json()
            console.log("Calls: ", calls)

            allCallData = calls

            const container = document.getElementById("callList")

            container.innerHTML = ""

            if (calls.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:gray;">
                        <i class="fa-solid fa-phone-slash" style="font-size:40px; margin-bottom:15px; opacity:0.5;"></i>
                        <p>No call history</p>
                    </div>
                `
                return
            }

            calls.forEach(call => {

                const div = document.createElement("div")

                div.className = "contact"
                div.setAttribute("data-id", call._id)

                const iconColor = call.missed ? "red" : "white"

                // Direction arrow icon
                let directionIcon = ""
                if (call.missed) {
                    directionIcon = `<i class="fa-solid fa-arrow-down" style="color:red; font-size:10px; margin-right:4px; transform:rotate(-45deg);"></i>`
                } else if (call.direction === "outgoing") {
                    directionIcon = `<i class="fa-solid fa-arrow-up" style="color:#25D366; font-size:10px; margin-right:4px; transform:rotate(45deg);"></i>`
                } else {
                    directionIcon = `<i class="fa-solid fa-arrow-down" style="color:#00c6ff; font-size:10px; margin-right:4px; transform:rotate(-45deg);"></i>`
                }

                div.innerHTML = `

${call.profileimage ?
                        `<img src="${call.profileimage}">`
                        :
                        call.isGroup
                            ? `<div class="group-icon"><i class="fa-solid fa-users"></i></div>`
                            : `<img src="/profilephotodefault.png">`
                    }

<div class="contact-info">

<strong>${call.name}</strong>

<div class="timestamp">

${directionIcon}

${call.type === "voice"
                        ? `<i class="fa-solid fa-phone" style="color:${iconColor}; font-size:12px;"></i>`
                        : `<i class="fa-solid fa-video" style="color:${iconColor}; font-size:12px;"></i>`}

${call.missed
                        ? `<span style="color:red;">Missed</span>`
                        : call.direction === "outgoing"
                            ? `<span style="color:#25D366;">Outgoing</span>`
                            : `<span style="color:#00c6ff;">Incoming</span>`}
${!call.missed && call.duration > 0 ? ` • ${formatDuration(call.duration)}` : ""}

<br>

<span style="font-size:12px;color:gray;">
${formatTime(call.time)}
</span>

</div>

</div>

`

                // Click handler - open chat or toggle checkbox
                div.addEventListener("click", () => {

                    if (selectMode) {
                        toggleCallSelection(call._id, div)
                        return
                    }

                    // Open chat with this contact
                    localStorage.setItem("chatWith", call.otherUser)
                    localStorage.setItem("chatName", call.name)
                    localStorage.setItem("isGroup", call.isGroup || false)

                    window.location.href = `/chat.html?from=${encodeURIComponent(call.otherUser)}&isGroup=${call.isGroup || false}&name=${encodeURIComponent(call.name)}&openChat=true`
                })

                container.appendChild(div)

            })

        }

        function formatDuration(sec) {

            if (!sec || sec <= 0) return ""

            let m = Math.floor(sec / 60)
            let s = sec % 60

            return m + ":" + String(s).padStart(2, "0")

        }

        function formatTime(timestamp) {
            const date = new Date(timestamp)
            const now = new Date()

            // Today
            if (date.toDateString() === now.toDateString()) {
                return "Today, " + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }

            // Yesterday
            const yesterday = new Date(now)
            yesterday.setDate(yesterday.getDate() - 1)
            if (date.toDateString() === yesterday.toDateString()) {
                return "Yesterday, " + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }

            return date.toLocaleDateString() + ", " + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }

        // ================= SELECT MODE =================

        document.getElementById("selectOption").addEventListener("click", () => {
            dropdownMenu.style.display = "none"
            enterSelectMode()
        })

        function enterSelectMode() {
            selectMode = true
            selectedCalls.clear()

            document.getElementById("selectBar").style.display = "flex"

            // Add checkboxes to all call items
            document.querySelectorAll("#callList .contact").forEach(div => {
                // Don't add duplicate checkboxes
                if (div.querySelector(".call-checkbox")) return

                const checkbox = document.createElement("input")
                checkbox.type = "checkbox"
                checkbox.className = "call-checkbox"
                checkbox.addEventListener("click", (e) => {
                    e.stopPropagation()
                    const id = div.getAttribute("data-id")
                    toggleCallSelection(id, div)
                })
                div.prepend(checkbox)
            })
        }

        function exitSelectMode() {
            selectMode = false
            selectedCalls.clear()

            document.getElementById("selectBar").style.display = "none"

            // Remove all checkboxes
            document.querySelectorAll(".call-checkbox").forEach(cb => cb.remove())
        }

        function toggleCallSelection(id, div) {
            if (selectedCalls.has(id)) {
                selectedCalls.delete(id)
            } else {
                selectedCalls.add(id)
            }

            // Update checkbox state
            const cb = div.querySelector(".call-checkbox")
            if (cb) {
                cb.checked = selectedCalls.has(id)
            }
        }

        // ================= DELETE SELECTED =================

        document.getElementById("deleteBtn").addEventListener("click", async () => {

            if (selectedCalls.size === 0) {
                alert("No calls selected")
                return
            }

            await fetch("/delete-calls", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    callIds: Array.from(selectedCalls),
                    userEmail: user
                })
            })

            exitSelectMode()
            loadCalls()
        })

        // ================= DELETE ALL =================

        document.getElementById("deleteAllBtn").addEventListener("click", async () => {

            const confirmDelete = confirm("Delete all call history?")
            if (!confirmDelete) return

            await fetch("/clear-calls", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userEmail: user
                })
            })

            exitSelectMode()
            loadCalls()
        })

        // ================= CANCEL =================

        document.getElementById("cancelBtn").addEventListener("click", () => {
            exitSelectMode()
        })

        // ================= INIT =================

        loadCalls()

    </script>

</body>

</html>

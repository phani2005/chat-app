<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calls</title>

    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="top-bar" id="top-bar">

            <i class="fa-solid fa-arrow-left back-btn" onclick="goBack()"></i>

            <h3>Calls</h3>

            <div class="menu">
                ⋮
                <div class="dropdown">
                    <p onclick="enableSelectMode()">Select</p>
                </div>
            </div>

        </div>
        <div id="selectBar" style="display:none;" class="select-bar">
            <button onclick="deleteSelectedCalls()" class="danger-btn">Delete</button>
            <button onclick="clearCalls()" class="danger-btn">Delete All</button>
            <button onclick="cancelSelect()" class="cancel-btn">Cancel</button>
        </div>

        <div id="callList"></div>

    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io()
        const user = localStorage.getItem("loggedUser")
        let selectMode = false
        let selectedCalls = new Set()
        // socket.emit("register-user", user)
        socket.on("connect", () => {
            console.log("connected register user: ", user)
            socket.emit("register-user", user)
        })
        window.addEventListener("focus", () => {
            console.log("👀 Page focused → reload calls")
            loadCalls()
        })

        // 🔥 listen for new call log
        socket.on("new-call-log", () => {
            console.log("🔄 New call log received")
            loadCalls()
        })

        // const user = localStorage.getItem("loggedUser")
        function goBack() {
            window.location.href = "/main.html"
        }

        async function loadCalls() {

            const res = await fetch(`/calls/${user}`, { cache: "no-store" })

            const calls = await res.json()
            console.log("Calls: ", calls)

            const container = document.getElementById("callList")

            container.innerHTML = ""
            const seen = new Set()
            calls
                .sort((a, b) => new Date(b.time) - new Date(a.time)) // latest first
                .forEach(call => {

                    // const key = call.otherUser + call.time
                    const key = call._id

                    if (seen.has(key)) return
                    seen.add(key)

                    const div = document.createElement("div")
                    div.className = "contact"
                    div.setAttribute("data-id", call._id)

                    const iconColor = call.missed ? "red" : "white"

                    // 🔥 FIX PROFILE IMAGE
                    let imgHTML = ""

                    if (call.isGroup) {
                        imgHTML = call.profileimage
                            ? `<img src="${call.profileimage}">`
                            : `<div class="group-icon"><i class="fa-solid fa-users"></i></div>`
                    } else {
                        imgHTML = `<img src="${call.profileimage || "/profilephotodefault.png"}">`
                    }

                    div.innerHTML = `

${imgHTML}

<div class="contact-info">

<strong>${call.name}</strong>

<div class="timestamp">

${call.type === "voice"
                            ? `<i class="fa-solid fa-phone" style="color:${iconColor}"></i>`
                            : `<i class="fa-solid fa-video" style="color:${iconColor}"></i>`}

${call.missed
                            ? `<span style="color:red;">Missed</span>`
                            : call.direction === "outgoing"
                                ? "Outgoing"
                                : "Incoming"}

• ${call.duration > 0 ? formatDuration(call.duration) : ""}

<br>

<span style="font-size:12px;color:gray;">
${new Date(call.time).toLocaleString()}
</span>

</div>

</div>
`
                    if (selectMode) {
                        const checkbox = document.createElement("input")
                        checkbox.type = "checkbox"
                        checkbox.className = "call-checkbox"

                        checkbox.addEventListener("change", () => {
                            if (checkbox.checked)
                                selectedCalls.add(call._id)
                            else
                                selectedCalls.delete(call._id)
                        })

                        div.prepend(checkbox)
                    }

                    container.appendChild(div)
                })

        }

        function formatDuration(sec) {

            let m = Math.floor(sec / 60)

            let s = sec % 60

            return m + ":" + String(s).padStart(2, "0")

        }
        function enableSelectMode() {
            selectMode = true
            selectedCalls.clear()

            document.getElementById("selectBar").style.display = "block"

            loadCalls() // 🔥 re-render with checkboxes
        }
        function cancelSelect() {
            selectMode = false
            selectedCalls.clear()

            document.getElementById("selectBar").style.display = "none"

            loadCalls()
        }
        async function deleteSelectedCalls() {

            if (selectedCalls.size === 0) {
                return alert("No calls selected")
            }

            await fetch("/delete-calls", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    callIds: Array.from(selectedCalls),
                    userEmail: user
                })
            })

            cancelSelect()
        }

        loadCalls()

    </script>

</body>

</html>
